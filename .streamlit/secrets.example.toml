# Copy to secrets.toml for local Streamlit use, or enter these values in
# Streamlit Community Cloud's app Secrets settings. Never commit real secrets.
FEEDBACK_DATABASE_MODE = "postgres"
FEEDBACK_DATABASE_URL = "postgresql://USER:PASSWORD@HOST:5432/postgres?sslmode=require"

# Email is optional. Add these keys when SMTP is configured.
FEEDBACK_SMTP_HOST = "smtp.gmail.com"
FEEDBACK_SMTP_PORT = "587"
FEEDBACK_SMTP_USERNAME = ""
FEEDBACK_SMTP_PASSWORD = ""
FEEDBACK_SMTP_FROM = ""
